# Weekly: Frey's model facts table from the reviewed branch (`dev`) of our models.dev fork
# (lannerk/models.dev; T-0116, AD132 ⑤) into catalog/models-facts.json, which `frey models refresh`
# reads. Built with the fork's own generator and schema (its frey/ directory); committed only when it
# fits and changed.
name: models-facts

on:
  schedule:
    - cron: "41 3 * * 1" # Monday 11:41 Asia/Shanghai, after the fork's sync has had a chance to be merged
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: models-facts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: lannerk/models.dev
          ref: dev
          path: .fork
      - name: The schema checker
        run: python3 -m pip install --user --disable-pip-version-check jsonschema==4.26.0
      - name: Build and check
        run: bash scripts/build_models_facts.sh .fork
      - name: Commit
        run: |
          git add catalog/models-facts.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          commit=$(python3 -c 'import json; print(json.load(open("catalog/models-facts.json"))["upstream_commit"][:12])')
          git -c user.name=agent-catalog-sync -c user.email=agent-catalog-sync@users.noreply.github.com \
            commit -q -m "catalog: models facts from models.dev $commit (reviewed)"
          git push -q origin HEAD:main
